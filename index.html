<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Prevents accidental zooming on iPhone/Android touch screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Algebra Sprint</title>
  <style>
    /* Reset & Base Layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a2e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none; /* Disables mobile swipe/pull-to-refresh */
    }

    .game-card {
      width: 90%;
      max-width: 420px;
      background-color: #16213e;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: bold;
      color: #e94560;
    }

    /* Timer Progress Bar */
    .timer-container {
      width: 100%;
      height: 10px;
      background-color: #0f3460;
      border-radius: 5px;
      overflow: hidden;
    }

    .timer-bar {
      width: 100%;
      height: 100%;
      background-color: #4ecca3;
      transition: width 0.1s linear;
    }

    /* Equation Screen */
    .equation-box {
      background-color: #0f3460;
      border-radius: 12px;
      padding: 30px 10px;
      min-height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .equation-text {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
    }

    /* Answers Grid */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .btn-option {
      background-color: #0f3460;
      border: 2px solid #533483;
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: bold;
      padding: 18px 0;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-option:active {
      transform: scale(0.95);
    }

    /* Correct/Incorrect Feedbacks */
    .btn-option.correct {
      background-color: #2e7d32 !important;
      border-color: #4caf50 !important;
    }

    .btn-option.wrong {
      background-color: #c62828 !important;
      border-color: #ef5350 !important;
    }

    /* Game Over Screen Overlay */
    .game-over-screen {
      display: none;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .game-over-title {
      font-size: 2rem;
      color: #e94560;
    }

    .final-score {
      font-size: 1.5rem;
      color: #ffffff;
    }

    .btn-action {
      background-color: #e94560;
      color: white;
      border: none;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 14px 30px;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-action:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="game-card">
    <!-- Active Gameplay View -->
    <div id="play-view" style="display: flex; flex-direction: column; gap: 20px;">
      <div class="header-bar">
        <div>Score: <span id="score">0</span></div>
        <div>Streak: <span id="streak">0</span> 🔥</div>
      </div>

      <div class="timer-container">
        <div id="timer-bar" class="timer-bar"></div>
      </div>

      <div class="equation-box">
        <div id="equation" class="equation-text">Solve for x...</div>
      </div>

      <div class="options-grid">
        <button class="btn-option" onclick="submitAnswer(this)">-</button>
        <button class="btn-option" onclick="submitAnswer(this)">-</button>
        <button class="btn-option" onclick="submitAnswer(this)">-</button>
        <button class="btn-option" onclick="submitAnswer(this)">-</button>
      </div>
    </div>

    <!-- Game Over View -->
    <div id="game-over-view" class="game-over-screen">
      <h2 class="game-over-title">Time's Up! ⏱️</h2>
      <p class="final-score">Final Score: <span id="final-score-val">0</span></p>
      <button class="btn-action" onclick="startGame()">Play Again</button>
    </div>
  </div>

  <script>
    // State variables
    let score = 0;
    let streak = 0;
    let currentAnswer = 0;
    let timerInterval = null;
    let timeLeft = 100; // Percentage of timer bar
    const QUESTION_TIME_SECONDS = 8;

    // Start or Reset the game
    function startGame() {
      score = 0;
      streak = 0;
      document.getElementById('score').innerText = score;
      document.getElementById('streak').innerText = streak;
      
      document.getElementById('play-view').style.display = 'flex';
      document.getElementById('game-over-view').style.display = 'none';

      nextQuestion();
    }

    // Generate a random linear algebra problem: ax + b = c or ax - b = c
    function generateAlgebraProblem() {
      const x = Math.floor(Math.random() * 10) + 1; // Solution x between 1 and 10
      const a = Math.floor(Math.random() * 5) + 1;  // Coefficient a between 1 and 5
      const b = Math.floor(Math.random() * 15) + 1; // Constant b between 1 and 15
      
      const isAddition = Math.random() > 0.5;
      let equationText = "";
      let c = 0;

      if (isAddition) {
        c = (a * x) + b;
        equationText = `${a}x + ${b} = ${c}`;
      } else {
        c = (a * x) - b;
        // Keep results clean by swapping if negative
        if (c <= 0) {
          c = (a * x) + b;
          equationText = `${a}x + ${b} = ${c}`;
        } else {
          equationText = `${a}x - ${b} = ${c}`;
        }
      }

      return { equationText, correctAnswer: x };
    }

    // Load a new problem and start the countdown
    function nextQuestion() {
      resetTimer();

      const problem = generateAlgebraProblem();
      currentAnswer = problem.correctAnswer;
      document.getElementById('equation').innerText = problem.equationText;

      // Generate 3 unique wrong choices
      let options = [currentAnswer];
      while (options.length < 4) {
        let wrongOption = currentAnswer + (Math.floor(Math.random() * 7) - 3);
        if (wrongOption > 0 && !options.includes(wrongOption)) {
          options.push(wrongOption);
        }
      }

      // Shuffle choices array
      options.sort(() => Math.random() - 0.5);

      // Render choices to buttons
      const buttons = document.querySelectorAll('.btn-option');
      buttons.forEach((btn, idx) => {
        btn.innerText = options[idx];
        btn.disabled = false;
        btn.className = 'btn-option'; // Reset color styles
      });

      startTimer();
    }

    // Handle button tap
    function submitAnswer(button) {
      clearInterval(timerInterval);
      const selectedValue = parseInt(button.innerText);
      const buttons = document.querySelectorAll('.btn-option');

      // Disable buttons to avoid double taps
      buttons.forEach(btn => btn.disabled = true);

      if (selectedValue === currentAnswer) {
        button.classList.add('correct');
        score += 10 + (streak * 2); // Bonus score for streaks
        streak += 1;
        document.getElementById('score').innerText = score;
        document.getElementById('streak').innerText = streak;

        setTimeout(nextQuestion, 600); // Brief pause before next round
      } else {
        button.classList.add('wrong');
        streak = 0;
        document.getElementById('streak').innerText = streak;
        
        // Highlight correct answer
        buttons.forEach(btn => {
          if (parseInt(btn.innerText) === currentAnswer) {
            btn.classList.add('correct');
          }
        });

        setTimeout(endGame, 1000);
      }
    }

    // Countdown Timer logic
    function startTimer() {
      timeLeft = 100;
      const decrementPerMs = 100 / (QUESTION_TIME_SECONDS * 10);
      
      timerInterval = setInterval(() => {
        timeLeft -= decrementPerMs;
        document.getElementById('timer-bar').style.width = `${timeLeft}%`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          endGame();
        }
      }, 100);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      document.getElementById('timer-bar').style.width = '100%';
    }

    // Trigger Game Over screen
    function endGame() {
      clearInterval(timerInterval);
      document.getElementById('play-view').style.display = 'none';
      document.getElementById('game-over-view').style.display = 'flex';
      document.getElementById('final-score-val').innerText = score;
    }

    // Initialize game on load
    window.onload = startGame;
  </script>
</body>
</html>
