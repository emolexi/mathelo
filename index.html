<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Singapore Math Age & ELO Arena</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a2e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }

    .game-card {
      width: 90%;
      max-width: 440px;
      background-color: #16213e;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: bold;
      color: #e94560;
    }

    .timer-container {
      width: 100%;
      height: 8px;
      background-color: #0f3460;
      border-radius: 4px;
      overflow: hidden;
    }

    .timer-bar {
      width: 100%;
      height: 100%;
      background-color: #4ecca3;
      transition: width 0.1s linear;
    }

    .equation-box {
      background-color: #0f3460;
      border-radius: 12px;
      padding: 20px 10px;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .badges-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .level-badge {
      font-size: 0.75rem;
      background-color: #533483;
      padding: 3px 8px;
      border-radius: 8px;
      color: #4ecca3;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .math-age-badge {
      font-size: 0.75rem;
      background-color: #e94560;
      padding: 3px 8px;
      border-radius: 8px;
      color: #ffffff;
      font-weight: bold;
    }

    .equation-text {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      margin-top: 5px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-option {
      background-color: #0f3460;
      border: 2px solid #533483;
      color: #ffffff;
      font-size: 1.3rem;
      font-weight: bold;
      padding: 14px 0;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-option:active {
      transform: scale(0.95);
    }

    .btn-option.correct {
      background-color: #2e7d32 !important;
      border-color: #4caf50 !important;
    }

    .btn-option.wrong {
      background-color: #c62828 !important;
      border-color: #ef5350 !important;
    }

    .screen {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .title {
      font-size: 1.8rem;
      color: #e94560;
      margin-bottom: 2px;
    }

    .input-field {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 2px solid #533483;
      background-color: #0f3460;
      color: white;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
    }

    .btn-action {
      background-color: #e94560;
      color: white;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 14px 20px;
      border-radius: 25px;
      cursor: pointer;
      width: 100%;
    }

    .btn-action:active {
      transform: scale(0.95);
    }

    .player-list {
      max-height: 140px;
      overflow-y: auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .player-item {
      background-color: #0f3460;
      padding: 10px 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 1px solid #533483;
    }

    .player-item:hover {
      background-color: #1b263b;
    }

    .stats-text {
      font-size: 1.05rem;
      color: #4ecca3;
    }
  </style>
</head>
<body>

  <div class="game-card">
    
    <!-- 1. Profile Selection / Login Screen -->
    <div id="profile-screen" class="screen">
      <h1 class="title">Math Age Arena</h1>
      <p style="color: #a0a0a0; font-size: 0.85rem;">PSLE to O-Level E-Math & A-Math Assessment</p>
      
      <div id="existing-players-container" style="width: 100%; display: none;">
        <p style="font-size: 0.85rem; text-align: left; margin-bottom: 5px; color: #4ecca3;">Select Profile:</p>
        <div id="player-list" class="player-list"></div>
      </div>

      <input type="text" id="new-player-input" class="input-field" placeholder="Enter Player Name" maxlength="15" />
      <button class="btn-action" onclick="createNewPlayer()">Start Assessment</button>
    </div>

    <!-- 2. Active Gameplay View -->
    <div id="play-view" class="screen" style="display: none;">
      <div class="header-bar" style="width: 100%;">
        <div><span id="display-name"></span> | <span id="display-elo" style="color: #4ecca3;">1000</span> ELO</div>
        <div>Streak: <span id="streak">0</span> 🔥</div>
      </div>

      <div class="timer-container">
        <div id="timer-bar" class="timer-bar"></div>
      </div>

      <div class="equation-box" style="width: 100%;">
        <div class="badges-row">
          <div id="syllabus-level" class="level-badge">Primary Level</div>
          <div id="math-age-tag" class="math-age-badge">Math Age: 9</div>
        </div>
        <div id="equation" class="equation-text">...</div>
      </div>

      <div class="options-grid" style="width: 100%;">
        <button class="btn-option" onclick="submitAnswer(this)">-</button>
        <button class="btn-option" onclick="submitAnswer(this)">-</button>
        <button class="btn-option" onclick="submitAnswer(this)">-</button>
        <button class="btn-option" onclick="submitAnswer(this)">-</button>
      </div>
    </div>

    <!-- 3. Game Over Screen -->
    <div id="game-over-view" class="screen" style="display: none;">
      <h2 class="title">Time's Up! ⏱️</h2>
      <p class="stats-text">Final Math Age: <span id="final-math-age" style="color: #e94560; font-weight: bold;">12</span></p>
      <p class="stats-text">Current ELO: <span id="final-elo">1000</span></p>
      <button class="btn-action" onclick="startGameplay()">Play Again</button>
      <button class="btn-action" style="background-color: #533483;" onclick="showProfileScreen()">Switch Player</button>
    </div>

  </div>

  <script>
    // Versioned database format to support future compatibility updates
    const DB_KEY = "math_age_game_db_v1";
    let db = { version: 1, activePlayer: null, players: {} };

    let roundScore = 0;
    let streak = 0;
    let currentAnswer = 0;
    let currentTier = "";
    let currentMathAge = 9;
    let timerInterval = null;
    let timeLeft = 100;
    const QUESTION_TIME_SECONDS = 10;

    window.onload = function() {
      const savedDb = localStorage.getItem(DB_KEY);
      if (savedDb) {
        try { db = JSON.parse(savedDb); } catch (e) { db = { version: 1, activePlayer: null, players: {} }; }
      }
      checkProfiles();
    };

    function saveDb() {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
    }

    function checkProfiles() {
      const playerNames = Object.keys(db.players);
      const container = document.getElementById('existing-players-container');
      const listEl = document.getElementById('player-list');
      
      listEl.innerHTML = "";
      if (playerNames.length > 0) {
        container.style.display = 'block';
        playerNames.forEach(name => {
          const p = db.players[name];
          const calculatedAge = getMathAge(p.elo);
          const div = document.createElement('div');
          div.className = 'player-item';
          div.innerHTML = `<span><strong>${name}</strong></span> <span style="color:#4ecca3;">Age ${calculatedAge} (${p.elo} ELO)</span>`;
          div.onclick = () => selectPlayer(name);
          listEl.appendChild(div);
        });
      } else {
        container.style.display = 'none';
      }

      document.getElementById('profile-screen').style.display = 'flex';
      document.getElementById('play-view').style.display = 'none';
      document.getElementById('game-over-view').style.display = 'none';
    }

    function createNewPlayer() {
      const nameInput = document.getElementById('new-player-input');
      const name = nameInput.value.trim();
      if (!name) { alert("Please enter a player name."); return; }
      if (!db.players[name]) {
        db.players[name] = { elo: 1000 };
      }
      db.activePlayer = name;
      saveDb();
      nameInput.value = "";
      startGameplay();
    }

    function selectPlayer(name) {
      db.activePlayer = name;
      saveDb();
      startGameplay();
    }

    function showProfileScreen() {
      checkProfiles();
    }

    function startGameplay() {
      document.getElementById('profile-screen').style.display = 'none';
      document.getElementById('game-over-view').style.display = 'none';
      document.getElementById('play-view').style.display = 'flex';

      const player = db.players[db.activePlayer];
      updateDisplayStats(player.elo);

      roundScore = 0;
      streak = 0;
      document.getElementById('streak').innerText = streak;
      nextQuestion();
    }

    function getMathAge(elo) {
      if (elo < 1050) return 9;   
      if (elo < 1120) return 11;  
      if (elo < 1200) return 12;  // PSLE Standard
      if (elo < 1280) return 14;  // Lower Sec
      if (elo < 1360) return 15;  // O-Level E-Math
      if (elo < 1440) return 16;  // O-Level A-Math
      return 17;                  
    }

    function updateDisplayStats(elo) {
      currentMathAge = getMathAge(elo);
      document.getElementById('display-name').innerText = db.activePlayer;
      document.getElementById('display-elo').innerText = elo;
      document.getElementById('math-age-tag').innerText = `Math Age: ${currentMathAge}`;
    }

    function generateMathProblem() {
      const elo = db.players[db.activePlayer].elo;
      let qText = "", ans = 0, tierLabel = "";

      if (elo < 1050) {
        tierLabel = "Primary 3-4";
        const a = Math.floor(Math.random() * 60) + 20;
        const b = Math.floor(Math.random() * 30) + 10;
        ans = a + b;
        qText = `${a} + ${b} = ?`;
      } else if (elo < 1120) {
        tierLabel = "Primary 5-6";
        const m1 = Math.floor(Math.random() * 9) + 2;
        const m2 = Math.floor(Math.random() * 9) + 2;
        ans = m1 * m2;
        qText = `${m1} × ${m2} = ?`;
      } else if (elo < 1200) {
        tierLabel = "PSLE Level";
        const base = Math.floor(Math.random() * 12) + 3;
        ans = base * 4;
        qText = `If 3 units = ${base * 3}, find 4 units`;
      } else if (elo < 1280) {
        tierLabel = "Sec 1-2 Algebra";
        const x = Math.floor(Math.random() * 8) + 2;
        const a = Math.floor(Math.random() * 4) + 2;
        const b = Math.floor(Math.random() * 10) + 2;
        const c = (a * x) + b;
        ans = x;
        qText = `Solve for x: ${a}x + ${b} = ${c}`;
      } else if (elo < 1360) {
        tierLabel = "O-Level E-Math";
        const r1 = Math.floor(Math.random() * 5) + 1;
        const r2 = Math.floor(Math.random() * 5) + 1;
        ans = r1 + r2;
        qText = `If roots of x² - ${r1+r2}x + ${r1*r2} = 0, find sum of roots`;
      } else {
        tierLabel = "O-Level A-Math";
        const base = Math.floor(Math.random() * 3) + 2;
        const power = Math.floor(Math.random() * 3) + 2;
        ans = Math.pow(base, power);
        qText = `Evaluate ${base}^${power} (Indices)`;
      }

      currentTier = tierLabel;
      return { qText, ans };
    }

    function nextQuestion() {
      resetTimer();

      const problem = generateMathProblem();
      currentAnswer = problem.ans;
      document.getElementById('syllabus-level').innerText = currentTier;
      document.getElementById('math-age-tag').innerText = `Math Age: ${currentMathAge}`;
      document.getElementById('equation').innerText = problem.qText;

      let options = [currentAnswer];
      while (options.length < 4) {
        let wrong = currentAnswer + (Math.floor(Math.random() * 7) - 3);
        if (!options.includes(wrong) && wrong >= 0) {
          options.push(wrong);
        }
      }
      options.sort(() => Math.random() - 0.5);

      const buttons = document.querySelectorAll('.btn-option');
      buttons.forEach((btn, idx) => {
        btn.innerText = options[idx];
        btn.disabled = false;
        btn.className = 'btn-option';
      });

      startTimer();
    }

    function submitAnswer(button) {
      clearInterval(timerInterval);
      const selectedValue = parseInt(button.innerText);
      const buttons = document.querySelectorAll('.btn-option');
      buttons.forEach(btn => btn.disabled = true);

      const player = db.players[db.activePlayer];

      if (selectedValue === currentAnswer) {
        button.classList.add('correct');
        roundScore += 10 + (streak * 2);
        streak += 1;
        document.getElementById('streak').innerText = streak;

        player.elo += 12;
        saveDb();
        updateDisplayStats(player.elo);

        setTimeout(nextQuestion, 600);
      } else {
        button.classList.add('wrong');
        streak = 0;
        document.getElementById('streak').innerText = streak;
        
        buttons.forEach(btn => {
          if (parseInt(btn.innerText) === currentAnswer) {
            btn.classList.add('correct');
          }
        });

        player.elo = Math.max(900, player.elo - 15);
        saveDb();
        updateDisplayStats(player.elo);

        setTimeout(endGame, 1000);
      }
    }

    function startTimer() {
      timeLeft = 100;
      const decrementPerMs = 100 / (QUESTION_TIME_SECONDS * 10);
      
      timerInterval = setInterval(() => {
        timeLeft -= decrementPerMs;
        document.getElementById('timer-bar').style.width = `${timeLeft}%`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          const player = db.players[db.activePlayer];
          player.elo = Math.max(900, player.elo - 10);
          saveDb();
          updateDisplayStats(player.elo);
          endGame();
        }
      }, 100);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      document.getElementById('timer-bar').style.width = '100%';
    }

    function endGame() {
      clearInterval(timerInterval);
      document.getElementById('play-view').style.display = 'none';
      document.getElementById('game-over-view').style.display = 'flex';
      document.getElementById('final-math-age').innerText = currentMathAge;
      document.getElementById('final-elo').innerText = db.players[db.activePlayer].elo;
    }
  </script>
</body>
</html>
